---
name: 'Accept SnapDiff screenshots'
description: >-
  Commit screenshot baselines accepted in a PR comment or a new issue
  (`/snap-diff accept run=<run id> [pr=<n>] <file>@<hash> ...`) from that run's report artifact.
  Run it from an issue_comment + issues workflow gated to OWNER/MEMBER/COLLABORATOR.
inputs:
  token:
    description: 'Token with contents: write, pull-requests: write, issues: write, actions: read (actions: write to dispatch ci-workflow); reads the author''s permission'
    default: ${{ github.token }}
  screenshots-path:
    description: 'Every accepted file must be committed under this directory (relative to the repository root)'
    default: 'doc/screenshots'
  ci-workflow:
    description: >-
      Optional workflow file name (with workflow_dispatch) to run on the PR branch after the commit.
      A push made with GITHUB_TOKEN does not start workflows; a workflow_dispatch does.
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Accept screenshots
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        SCREENSHOTS_PATH: ${{ inputs.screenshots-path }}
        EVENT_NAME: ${{ github.event_name }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        # issue_comment: the comment on the PR; issues: the new issue itself.
        BODY: ${{ github.event_name == 'issues' && github.event.issue.body || github.event.comment.body }}
        AUTHOR: ${{ github.event_name == 'issues' && github.event.issue.user.login || github.event.comment.user.login }}
        AUTHOR_ASSOCIATION: ${{ github.event_name == 'issues' && github.event.issue.author_association || github.event.comment.author_association }}
      run: ruby "$GITHUB_ACTION_PATH/accept_screenshots.rb"
