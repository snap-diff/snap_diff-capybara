---
name: Accept screenshots

# The report's "Commit decisions" button opens a new issue whose body is the
# review command (or a maintainer pastes it as a PR comment):
#   /snap-diff accept run=<run id> [pr=<n>] <file>@<hash> ...
# The action commits those files from that run's report artifact to the PR branch.

on:
  issue_comment:
    types: [ created ]
  issues:
    types: [ opened ]

jobs:
  accept:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/snap-diff ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' &&
       startsWith(github.event.issue.body, '/snap-diff ') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    # Per PR for comments, per issue for issues (the PR is not known yet);
    # two issues for one PR may run at once, and the push lease lets only one land.
    concurrency:
      group: snap-diff-accept-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # The default branch (the ref of both events): this repository's trusted
      # code, needed for the local action. The PR's code is never checked out here.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/accept-screenshots
        with:
          screenshots-path: test/fixtures/app/doc/screenshots
          ci-workflow: test.yml
