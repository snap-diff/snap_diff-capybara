---
name: Review page

on:
  push:
    branches: [ master ]
    paths:
      - 'lib/snap_diff/review/**'
      - '.github/actions/deploy-review-page/**'
      - '.github/workflows/review-page.yml'
  workflow_dispatch:

# Two pushes racing to gh-pages would fail the second as a non-fast-forward.
concurrency:
  group: review-page

jobs:
  deploy:
    name: Publish the review page
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/deploy-review-page
        with:
          page: lib/snap_diff/review/index.html
